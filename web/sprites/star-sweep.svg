<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- advent-for-two 默认的小家伙：一颗小星星。想换成自己的：画布保持 -15 -25 45 45，身子放在 x 0–15，脚踩在 y≈16。 -->
  <style>.b{transform-origin:7.5px 16px;animation:sw 1.2s ease-in-out infinite}.br{transform-origin:12.5px 9px;animation:br 1.2s ease-in-out infinite}
    @keyframes sw{50%{transform:rotate(-4deg)}}@keyframes br{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-14deg)}}
    .sn{animation:sn 1.2s ease-out infinite;opacity:0}@keyframes sn{10%{opacity:.9}60%{opacity:0;transform:translate(4px,-2px)}}</style>
  <ellipse cx="7.5" cy="16.5" rx="5" ry=".7" fill="#000" opacity=".12"/><g class="b"><g class=""><path d="M5.6 12.6 L5.6 15.4" stroke="#b07a2a" stroke-width=".9" stroke-linecap="round"/><ellipse cx="5.25" cy="15.8" rx="1.15" ry=".6" fill="#5a3a1a"/></g><g class=""><path d="M9.4 12.6 L9.4 15.4" stroke="#b07a2a" stroke-width=".9" stroke-linecap="round"/><ellipse cx="9.75" cy="15.8" rx="1.15" ry=".6" fill="#5a3a1a"/></g><polygon points="7.50,-2.00 9.91,3.28 15.68,3.94 11.40,7.87 12.55,13.56 7.50,10.70 2.45,13.56 3.60,7.87 -0.68,3.94 5.09,3.28" fill="#f4c95d" stroke="#b07a2a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M3.2 3.6 Q5 1.4 7.5 0.6" fill="none" stroke="#fff3c9" stroke-width=".7" stroke-linecap="round" opacity=".8"/><ellipse cx="5.6" cy="7.4" rx=".62" ry=".85" fill="#5a3a1a"/><ellipse cx="9.4" cy="7.4" rx=".62" ry=".85" fill="#5a3a1a"/><circle cx="5.8" cy="7.1" r=".22" fill="#fff"/><circle cx="9.6" cy="7.1" r=".22" fill="#fff"/><ellipse cx="4.3" cy="9.3" rx="1" ry=".6" fill="#ef9a7a" opacity=".7"/><ellipse cx="10.7" cy="9.3" rx="1" ry=".6" fill="#ef9a7a" opacity=".7"/><path d="M6.6 9.3 Q7.5 10.2 8.4 9.3" fill="none" stroke="#5a3a1a" stroke-width=".5" stroke-linecap="round"/></g>
  <g class="br"><path d="M12.5 9 L17 16" stroke="#8b5a2b" stroke-width=".8" stroke-linecap="round"/><path d="M15.9 14.2 L17.3 13.4 L20.2 16.9 L16.2 17.3 Z" fill="#e2bf73" stroke="#8b6a32" stroke-width=".35" stroke-linejoin="round"/><path d="M16.6 14.4 L17 17.2 M17.4 14.1 L18.2 17.1 M18.1 14.6 L19.3 17" stroke="#a7843f" stroke-width=".25"/><path d="M15.8 14.1 L17.4 13.3" stroke="#8b3a2a" stroke-width=".6" stroke-linecap="round"/></g>
  <circle class="sn" cx="19" cy="15.5" r=".5" fill="#fff"/><circle class="sn" cx="20" cy="16" r=".35" fill="#fff" style="animation-delay:.15s"/>
</svg>
